<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TecoBooks — 교육용 도서 프로토타입</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#183a32;font:1rem/1.6 system-ui}
    main{max-width:52rem;margin:auto;padding:2rem 1rem}aside{padding:.8rem;background:#fff1d6;border-radius:.6rem}
    nav{display:flex;gap:.5rem;margin:1.5rem 0;flex-wrap:wrap}button,input{font:inherit}
    button{background:#17684f;color:white;border:0;border-radius:.5rem;padding:.65rem 1rem;cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid #b76b12;outline-offset:3px}
    article{background:white;padding:1.3rem;border-radius:.8rem;margin:1rem 0}
    label{display:block}input{width:100%;padding:.7rem;border:1px solid #78958b;border-radius:.4rem}
    h1,h2{line-height:1.3}[hidden]{display:none!important}.muted{color:#4d665d}
  </style>
</head>
<body>
<main>
  <h1>TecoBooks</h1>
  <aside>교육용 프로토타입 · 가상 도서 3권 · 대출/로그인/서버 저장 기능 없음</aside>
  <nav aria-label="화면 선택">
    <button type="button" data-screen="home">도서 목록</button>
    <button type="button" data-screen="records">내 독서 기록</button>
  </nav>
  <section id="home">
    <h2>도서 목록</h2>
    <label for="query">제목 또는 분야 검색</label>
    <input id="query" type="search" placeholder="예: 기획">
    <p id="count" role="status"></p>
    <div id="books"></div>
  </section>
  <section id="detail" hidden>
    <h2 id="book-title"></h2>
    <p id="book-description"></p>
    <button id="mark-read" type="button">읽은 책으로 기록</button>
    <p id="record-status" role="status"></p>
  </section>
  <section id="records" hidden>
    <h2>내 독서 기록</h2>
    <p class="muted">현재 탭에서만 유지됩니다. 새로고침하면 초기화됩니다.</p>
    <ul id="read-books"></ul>
    <p id="empty-records">아직 기록한 책이 없습니다.</p>
  </section>
  <footer class="muted">배포 버전: <strong id="version">lab-v1</strong></footer>
</main>
<script>
  const books = [
    {id:1,title:'함께 만드는 서비스',category:'기획',description:'가상 도서: 사용자 문제를 정의하고 프로토타입으로 검증하는 이야기입니다.'},
    {id:2,title:'숫자로 설명하는 하루',category:'데이터',description:'가상 도서: 샘플 데이터를 분석하고 숫자의 의미를 전달하는 이야기입니다.'},
    {id:3,title:'팀을 위한 작은 자동화',category:'업무',description:'가상 도서: 반복 업무를 줄이고 결과를 검증하는 이야기입니다.'}
  ];
  const read = new Set();
  let selected = null;
  function showScreen(name) {
    document.querySelectorAll('main > section').forEach(section => { section.hidden = section.id !== name; });
    if (name === 'records') {
      const list = document.getElementById('read-books');
      list.replaceChildren();
      books.filter(book => read.has(book.id)).forEach(book => {
        const item = document.createElement('li');
        item.textContent = book.title;
        list.append(item);
      });
      document.getElementById('empty-records').hidden = read.size > 0;
    }
  }
  function renderBooks() {
    const query = document.getElementById('query').value.trim().toLowerCase();
    const matches = books.filter(book => `${book.title} ${book.category}`.toLowerCase().includes(query));
    const list = document.getElementById('books');
    list.replaceChildren();
    matches.forEach(book => {
      const card = document.createElement('article');
      const title = document.createElement('h3');
      title.textContent = book.title;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `${book.title} 상세 보기`;
      button.addEventListener('click', () => {
        selected = book;
        document.getElementById('book-title').textContent = book.title;
        document.getElementById('book-description').textContent = book.description;
        document.getElementById('record-status').textContent = read.has(book.id) ? '이미 기록한 책입니다.' : '';
        showScreen('detail');
      });
      card.append(title, button);
      list.append(card);
    });
    document.getElementById('count').textContent = matches.length ? `${matches.length}권을 찾았습니다.` : '검색 결과가 없습니다.';
  }
  document.querySelectorAll('[data-screen]').forEach(button => {
    button.addEventListener('click', () => showScreen(button.dataset.screen));
  });
  document.getElementById('query').addEventListener('input', renderBooks);
  document.getElementById('mark-read').addEventListener('click', () => {
    if (!selected) throw new Error('도서를 먼저 선택하세요.');
    const duplicate = read.has(selected.id);
    read.add(selected.id);
    document.getElementById('record-status').textContent = duplicate ? '이미 기록한 책입니다.' : '독서 기록에 추가했습니다.';
  });
  renderBooks();
</script>
</body>
</html>
